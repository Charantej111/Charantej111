 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#89909a" stroke-opacity=".12" stroke-width="1"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
<rect width="1200" height="370" rx="18" fill="url(#bg)"/>
