<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Charan Teja, product-minded builder</title>
<desc id="desc">Dark editorial banner with warm amber typography and a product workflow illustration.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d10"/><stop offset=".52" stop-color="#14171c"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
